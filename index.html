<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Win Loss Overlay</title>
<style>
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font-family:Arial,Helvetica,sans-serif}
#hud{position:absolute;left:30px;bottom:30px;width:330px;filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}
.row{height:58px;margin-top:6px;display:flex;align-items:center;border-radius:12px;overflow:hidden;background:linear-gradient(90deg,#15171c,#08090d);border:2px solid #292d35;box-sizing:border-box}
.icon{width:64px;height:100%;display:flex;align-items:center;justify-content:center;font-size:31px;font-weight:900}
.w .icon{background:linear-gradient(135deg,#2b2100,#806400);color:#ffd33d;border-right:4px solid #d9a900}
.l .icon{background:linear-gradient(135deg,#310b0b,#8c1111);color:#ff3333;border-right:4px solid #ff3333}
.letter{width:72px;text-align:center;color:#fff;font-size:38px;font-weight:900;font-style:italic}
.num{flex:1;text-align:center;color:#fff;font-size:34px;font-weight:900;letter-spacing:1px}
</style>
</head>
<body>
<div id="hud">
  <div class="row w"><div class="icon">♛</div><div class="letter">W</div><div class="num" id="wins">12</div></div>
  <div class="row l"><div class="icon">×</div><div class="letter">L</div><div class="num" id="losses">5</div></div>
</div>
<script>
const bc = new BroadcastChannel('win-loss-overlay');
let state = {wins:12, losses:5};
const params = new URLSearchParams(location.search);
if(params.has('w')) state.wins = Number(params.get('w')) || 0;
if(params.has('l')) state.losses = Number(params.get('l')) || 0;
function render(){wins.textContent=state.wins; losses.textContent=state.losses}
render();
bc.onmessage=e=>{ if(e.data && typeof e.data==='object'){ state={...state,...e.data}; render(); }};
</script>
</body>
</html>
